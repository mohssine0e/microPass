name: microPass CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download compiled React application
        uses: actions/download-artifact@v4
        with:
          name: micropass-frontend
          path: frontend/dist

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test with PostgreSQL Testcontainers
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify React is packaged in the Spring Boot JAR
        run: jar tf backend/target/micropass-0.0.1-SNAPSHOT.jar | grep -q 'BOOT-INF/classes/static/index.html'

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload production frontend
        uses: actions/upload-artifact@v4
        with:
          name: micropass-frontend
          path: frontend/dist
          if-no-files-found: error

server.port=9090

# H2 Database configuration (persisting to a local file in user home or project directory)
spring.datasource.url=jdbc:h2:file:./data/micropassdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable virtual threads (Java 21)
spring.threads.virtual.enabled=true

# microPass custom workspace directory for Git checkouts and builds
micropass.workspace.base-dir=${user.home}/.micropass/workspaces
micropass.ports.start=9100
micropass.ports.end=9200


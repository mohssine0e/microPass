server.port=9090

# H2 Database configuration (persisting to a local file in user home or project directory)
spring.datasource.url=jdbc:h2:file:./data/micropassdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Enable virtual threads (Java 21)
spring.threads.virtual.enabled=true

# microPass custom workspace directory for Git checkouts and builds
micropass.workspace.base-dir=${user.home}/.micropass/workspaces
micropass.ports.start=9100
micropass.ports.end=9200
micropass.container.memory=512m
micropass.container.cpus=1.0
micropass.container.pids-limit=256
micropass.proxy.enabled=${MICROPASS_PROXY_ENABLED:false}
micropass.proxy.public-port=9080
micropass.proxy.admin-url=http://127.0.0.1:2019

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=micropass
spring.rabbitmq.password=micropass
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

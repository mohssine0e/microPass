# Production-like local profile. Start PostgreSQL and RabbitMQ with:
#   docker compose up -d postgres rabbitmq
# Then run Spring Boot with:
#   SPRING_PROFILES_ACTIVE=postgres mvn -pl backend spring-boot:run

spring.datasource.url=${MICROPASS_DATABASE_URL:jdbc:postgresql://localhost:5432/micropass}
spring.datasource.username=${MICROPASS_DATABASE_USERNAME:micropass}
spring.datasource.password=${MICROPASS_DATABASE_PASSWORD:micropass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Use PostgreSQL dialect with ddl-auto=create-drop for integration tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Repository integration tests do not consume deployment jobs.
spring.rabbitmq.listener.simple.auto-startup=false

# microPass custom workspace directory for Git checkouts and builds
micropass.workspace.base-dir=${java.io.tmpdir}/micropass-test-workspaces
micropass.ports.start=9100
micropass.ports.end=9200

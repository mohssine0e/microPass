services:
  postgres:
    image: postgres:16-alpine
    container_name: micropass-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: micropass
      POSTGRES_USER: micropass
      POSTGRES_PASSWORD: micropass
    volumes:
      - micropass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micropass -d micropass"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: micropass-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: micropass
      RABBITMQ_DEFAULT_PASS: micropass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  micropass-postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: micropass-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: micropass
      POSTGRES_USER: micropass
      POSTGRES_PASSWORD: micropass
    volumes:
      - micropass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micropass -d micropass"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: micropass-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: micropass
      RABBITMQ_DEFAULT_PASS: micropass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    container_name: micropass-proxy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--resume"]
    ports:
      - "9080:9080"
      - "127.0.0.1:2019:2019"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - micropass-proxy-config:/config
      - micropass-proxy-data:/data
    restart: unless-stopped

volumes:
  micropass-postgres-data:
  micropass-proxy-config:
  micropass-proxy-data:
